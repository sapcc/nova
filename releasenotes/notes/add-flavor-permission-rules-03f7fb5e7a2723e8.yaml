---
features:
  - |
    Added flavor permission rules (microversion 2.100), a new resource for
    controlling which OpenStack domains and projects are permitted to use a
    given public flavor. Each flavor permission rule has a ``domain_id``, an
    optional ``project_id``, an optional ``flavor_id``, and an ``effect``
    (``allow`` or ``deny``). A rule without a ``flavor_id`` defines the default
    effect for the domain or project that it applies to.

    New APIs are available starting with microversion 2.100:

    - ``GET    /flavor-permission-rules`` lists rules
    - ``POST   /flavor-permission-rules`` creates a rule
    - ``GET    /flavor-permission-rules/{id}`` shows a rule
    - ``PUT    /flavor-permission-rules/{id}`` updates a rule's effect
    - ``DELETE /flavor-permission-rules/{id}`` deletes a rule

    The ``GET /flavors`` and ``GET /flavors/detail`` APIs gain optional
    ``domain_permission`` and ``project_permission`` query parameters to
    filter flavors by their effective permission for the caller's domain or
    project. The ``GET /flavors/{id}`` and ``GET /flavors/detail`` responses
    also include the effective ``domain_permission`` and
    ``project_permission`` for callers with the appropriate policy.

    Access to the new APIs is controlled by new policies under the
    ``os_compute_api:os-flavor-permission-rules`` namespace. These policies
    also restrict the access to the new flavor API query parameters and
    response values. Only administrators have access by default.
upgrade:
  - |
    A new database migration adds the ``flavor_permission_rules`` table to the
    Nova API database. Run ``nova-manage api_db sync`` before starting the
    upgraded ``nova-api`` service.
